<div class="flex min-h-screen w-full flex-col bg-slate-50">
    <app-brand-header />

    <div class="flex flex-1 items-center justify-center px-6 py-10">
        <div class="w-full max-w-6xl">
            <div class="grid w-full gap-8 lg:grid-cols-[1.1fr_0.9fr]">
                <div class="p-8">
                   

                </div>

                <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-xl">
                    <div class="text-2xl font-semibold text-slate-900">
                        Admin Sign In
                    </div>
                    <div class="mt-1 text-sm text-slate-500">
                        Use your admin credentials to manage cards.
                    </div>

                    @if (showAlert) {
                        <ftm-alert
                            class="mt-4"
                            [appearance]="'outline'"
                            [showIcon]="false"
                            [type]="alert.type"
                            [@shake]="alert.type === 'error'"
                        >
                            {{ alert.message }}
                        </ftm-alert>
                    }

                    <form
                        class="mt-6 space-y-4"
                        [formGroup]="signInForm"
                        #signInNgForm="ngForm"
                    >
                        <mat-form-field class="w-full" appearance="outline">
                            <mat-label>Username</mat-label>
                            <input
                                id="username"
                                matInput
                                class="text-base"
                                [formControlName]="'username'"
                            />
                            @if (signInForm.get('username').hasError('required')) {
                                <mat-error> Username is required </mat-error>
                            }
                        </mat-form-field>

                        <mat-form-field class="w-full" appearance="outline">
                            <mat-label>Password</mat-label>
                            <input
                                id="password"
                                matInput
                                class="text-base"
                                type="password"
                                [formControlName]="'password'"
                                #passwordField
                            />
                            <button
                                mat-icon-button
                                type="button"
                                (click)="
                                    passwordField.type === 'password'
                                        ? (passwordField.type = 'text')
                                        : (passwordField.type = 'password')
                                "
                                matSuffix
                            >
                                @if (passwordField.type === 'password') {
                                    <mat-icon
                                        class="icon-size-5"
                                        [svgIcon]="'heroicons_solid:eye'"
                                    ></mat-icon>
                                }
                                @if (passwordField.type === 'text') {
                                    <mat-icon
                                        class="icon-size-5"
                                        [svgIcon]="'heroicons_solid:eye-slash'"
                                    ></mat-icon>
                                }
                            </button>
                            <mat-error> Password is required </mat-error>
                        </mat-form-field>

                        <div class="flex items-center justify-between">
                            <mat-checkbox
                                class="-ml-2"
                                [color]="'primary'"
                                [formControlName]="'rememberMe'"
                                >Remember me</mat-checkbox
                            >
                            <a
                                class="text-sm font-medium text-primary-500 hover:underline"
                                [routerLink]="['/forgot-password']"
                                >Forgot Password?</a
                            >
                        </div>

                        <button
                            class="ftm-mat-button-large w-full !bg-primary-600 !text-white !shadow-lg !shadow-primary-500/30 transition hover:!bg-primary-700 focus:!ring-4 focus:!ring-primary-300"
                            mat-flat-button
                            [disabled]="signInForm.disabled"
                            (click)="signIn()"
                        >
                            @if (!signInForm.disabled) {
                                <span class="flex items-center justify-center gap-2">
                                    <mat-icon
                                        class="icon-size-5"
                                        [svgIcon]="'heroicons_solid:lock-closed'"
                                    ></mat-icon>
                                    <span>Sign in</span>
                                </span>
                            }
                            @if (signInForm.disabled) {
                                <mat-progress-spinner
                                    [diameter]="24"
                                    [mode]="'indeterminate'"
                                ></mat-progress-spinner>
                            }
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <app-brand-footer />
</div>
